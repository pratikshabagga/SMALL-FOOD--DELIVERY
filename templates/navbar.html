<nav class="navbar navbar-expand-lg navbar-light bg-light">
  <div class="container-fluid">
    <a class="navbar-brand" href="{{ url_for('main.index') }}">
      <span style="font-size: 1.5rem">🍔 QuickBite</span>
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
      data-bs-target="#navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarSupportedContent">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item">
          <a class="nav-link {% if request.endpoint == 'main.index' %}active{% endif %}" href="{{ url_for('main.index') }}">Home</a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if request.endpoint == 'user.view_restaurants' %}active{% endif %}" href="{{ url_for('user.view_restaurants') }}">Restaurants</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="#">Offers</a>
        </li>
      </ul>

      <form class="d-flex me-2" method="GET" action="{{ url_for('user.search_restaurants') }}">
        <input class="form-control" type="search" placeholder="Search restaurants..." name="query" required>
      </form>

      {% if 'user_id' in session %}
        <a href="{{ url_for('auth_bp.logout') }}" class="btn btn-outline-danger me-2">Logout</a>
      {% else %}
        <div class="dropdown me-2">
          <button class="btn btn-primary dropdown-toggle" type="button" id="loginDropdown" data-bs-toggle="dropdown" aria-expanded="false">
            Login
          </button>
          <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="loginDropdown">
            <li><a class="dropdown-item" href="{{ url_for('auth_bp.login_customer') }}">Login as Customer</a></li>
            <li><a class="dropdown-item" href="{{ url_for('auth_bp.login_partner') }}">Login as Partner</a></li>
          </ul>
        </div>
      {% endif %}

      <a href="{{ url_for('user.view_cart') }}" class="btn btn-outline-warning">
        Cart ({{ session.get('cart')|length if session.get('cart') else 0 }})
      </a>
    </div>
  </div>
</nav>
