{% extends "base.html" %}

{% block content %}
<h1>Edit Restaurant</h1>

<form method="POST" enctype="multipart/form-data">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="form-group">
        <label for="name">Restaurant Name</label>
        <input type="text" class="form-control" id="name" name="name" value="{{ restaurant[1] }}" required>
    </div>
    <div class="form-group">
        <label for="address">Address</label>
        <input type="text" class="form-control" id="address" name="address" value="{{ restaurant[2] }}" required>
    </div>
    <div class="form-group">
        <label for="contact">Contact</label>
        <input type="text" class="form-control" id="contact" name="contact" value="{{ restaurant[3] }}" required>
    </div>
      <div class="form-group">
        <label for="ABN">ABN</label>
        <input type="text" name="abn" value="{{ restaurant[5] }}" class="form-control" required>

    </div>
    <div class="form-group">
        <label for="image_file">Restaurant Image</label>
        <input type="file" class="form-control" id="image_file" name="image_file">
        {% if restaurant[4] and restaurant[4] != '' %}
            <img src="{{ url_for('static', filename=restaurant[4]) }}" width="100" alt="Current Image">
        {% else %}
            <p>No image available</p>
        {% endif %}
    </div>
    <button type="submit" class="btn btn-primary">Save Changes</button>
</form>
{% endblock %}
