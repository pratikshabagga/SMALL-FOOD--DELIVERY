<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QuickBite - Food Delivery</title>
    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- Custom CSS -->
    <link href="{{ url_for('static', filename='css/styles.css') }}" rel="stylesheet" />

  </head>
  <body>
<h2>Edit Restaurant</h2>
<form method="POST" enctype="multipart/form-data">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label for="name">Restaurant Name</label>
    <input type="text" id="name" name="name" value="{{ restaurant[1] }}" required>

    <label for="address">Address</label>
    <input type="text" id="address" name="address" value="{{ restaurant[2] }}" required>

    <label for="contact">Contact</label>
    <input type="text" id="contact" name="contact" value="{{ restaurant[3] }}" required>

    <label for="abn">ABN</label>
    <input type="text" id="abn" name="abn" value="{{ restaurant[5] }}" required>

    <label for="image_file">Image</label>
    <input type="file" id="image_file" name="image_file">

    <button type="submit">Update Restaurant</button>
</form>

<h3>Products</h3>
<table>
    <thead>
        <tr>
            <th>Product Name</th>
            <th>Price</th>
            <th>Image</th>
            <th>Actions</th>
        </tr>
    </thead>
    <tbody>
        {% for product in products %}
            <tr>
                <td>{{ product[1] }}</td>
                <td>${{ product[2] }}</td>
                <td><img src="{{ url_for('static', filename=product[3]) }}" width="100"></td>
                <td>
                    <a href="{{ url_for('admin.edit_product', prod_id=product[0]) }}">Edit</a>
                    <form method="POST" action="{{ url_for('admin.delete_product', prod_id=product[0]) }}" style="display:inline;">
                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                        <button type="submit" onclick="return confirm('Are you sure you want to delete this product?')">Delete</button>
                    </form>
                </td>
            </tr>
        {% endfor %}
    </tbody>
</table>

</body>
</html>
